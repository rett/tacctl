authenticator_type_bcrypt: &authenticator_type_bcrypt 1
action_deny:  &action_deny  1
action_permit: &action_permit 2
accounter_type_file: &accounter_type_file 3
handler_type_start: &handler_type_start 1
provider_type_prefix: &provider_type_prefix 1
file_accounter: &file_accounter
  name: tacquito_accounter
  type: *accounter_type_file
readonly: &readonly
  name: readonly
  services:
    - {name: shell, set_values: [{name: priv-lvl, values: [1]}]}
    - {name: junos-exec, set_values: [{name: local-user-name, values: [RO-CLASS]}]}
  accounter: *file_accounter
operator: &operator
  name: operator
  services:
    - {name: shell, set_values: [{name: priv-lvl, values: [7]}]}
    - {name: junos-exec, set_values: [{name: local-user-name, values: [OP-CLASS]}]}
  accounter: *file_accounter
superuser: &superuser
  name: superuser
  services:
    - {name: shell, set_values: [{name: priv-lvl, values: [15]}]}
    - {name: junos-exec, set_values: [{name: local-user-name, values: [RW-CLASS]}]}
  accounter: *file_accounter
shared_scopes: &shared [lab]
users:
  - name: a
    scopes: *shared
    groups: [*readonly]
    authenticator: {type: 1, options: {hash: "243262243132244141414141414141414141414141414141414141414141414141414141414141414141414141414141414141414141414141414141"}}
    accounter: *file_accounter
  - name: b
    scopes: *shared
    groups: [*readonly]
    authenticator: {type: 1, options: {hash: "243262243132244242424242424242424242424242424242424242424242424242424242424242424242424242424242424242424242424242424242"}}
    accounter: *file_accounter
secrets:
  - name: lab
    secret: {group: tacquito, key: "lab-secret-0123456789abcdef"}
    handler: {type: *handler_type_start}
    type: *provider_type_prefix
    options:
      prefixes: |
        ["192.168.0.0/16"]
prefix_deny: *shared
