authenticator_type_bcrypt: &authenticator_type_bcrypt 1
action_deny:  &action_deny  1
action_permit: &action_permit 2
accounter_type_file: &accounter_type_file 3
handler_type_start: &handler_type_start 1
provider_type_prefix: &provider_type_prefix 1
file_accounter: &file_accounter
  name: tacquito_accounter
  type: *accounter_type_file
readonly: &readonly
  name: readonly
  services:
    - {name: shell, set_values: [{name: priv-lvl, values: [1]}]}
    - {name: junos-exec, set_values: [{name: local-user-name, values: [RO-CLASS]}]}
  accounter: *file_accounter
operator: &operator
  name: operator
  services:
    - {name: shell, set_values: [{name: priv-lvl, values: [7]}]}
    - {name: junos-exec, set_values: [{name: local-user-name, values: [OP-CLASS]}]}
  accounter: *file_accounter
superuser: &superuser
  name: superuser
  services:
    - {name: shell, set_values: [{name: priv-lvl, values: [15]}]}
    - {name: junos-exec, set_values: [{name: local-user-name, values: [RW-CLASS]}]}
  accounter: *file_accounter
users:
  - name: alice
    scopes: [lab, prod, s2]
    groups: [*readonly]
    authenticator: {type: 1, options: {hash: "243262243132244141414141414141414141414141414141414141414141414141414141414141414141414141414141414141414141414141414141"}}
    accounter: *file_accounter
secrets:
  - name: lab
    secret: {group: tacquito, key: "lab-secret-0123456789abcdef"}
    handler: {type: *handler_type_start}
    type: *provider_type_prefix
    options:
      prefixes: |
        ["192.168.0.0/16"]
  - plain-string
  - {secret: {key: k}}
  - {name: '', type: 1}
  - {name: 5, type: 1}
  - {name: dns, type: 2, secret: {key: k}}
  - name: prod
    type: 1
    secret: {group: tacquito, key: "prod-secret-0123456789", extra: 1}
    handler: {type: 1, options: {x: 1}}
    options: {prefixes: '["10.0.0.0/8", 7, "10.1.1.1/8", "bogus", "10.0.0.0/8"]', suffix: x}
    extra: here
  - name: prod
    type: 1
    secret: {key: "prod-secret-0123456789"}
    handler: {type: 2}
    options:
      prefixes: |
        [ "172.16.0.0/12", ]
  - name: prod
    type: 1
    secret: {key: "other-prod-secret-01234"}
    handler: {type: 1, extra: 1}
    options:
      prefixes: '{"a": "10.9.0.0/16", "b": "fd00::/8"}'
  - name: s2
    type: 1
    secret: {key: 1234567890}
    handler: "start"
    options: "x"
  - name: s2
    type: 1.0
    secret: {key: "s2-secret-0123456789abc"}
    handler: {type: true}
    options: {prefixes: [10.5.0.0/16]}
  - name: s3
    type: 1
    secret: "flat"
    handler: {type: 1}
    options: {prefixes: '"10.7.0.0/16"'}
  - name: s4
    type: 1
    secret: {key: "s4-secret-0123456789abc"}
    handler: {type: 1}
    options:
      prefixes: ""
  - name: s5
    type: 1
    secret: {key: "s5-secret-0123456789abc"}
    handler: {type: 1}
    options:
      prefixes: '[NaN, "10.8.0.0/16"]'
  - name: v6
    type: 1
    secret: {key: "v6-secret-0123456789abc"}
    handler: {type: 1}
    options:
      prefixes: '["2001:DB8:0:0::/48", "::ffff:10.0.0.0/104", "2001:db8::1/128"]'
prefix_allow: [10.0.0.0/8, 10.0.0.0/8, "2001:DB8::/32", [1], {a: b}]
