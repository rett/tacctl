name: docs-site
on:
  push:
    branches: ["gh-pages"]
  pull_request:
    branches: ["gh-pages"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter fonts-dejavu-core \
              libpango-1.0-0 libpangoft2-1.0-0
          pip install --break-system-packages weasyprint markdown pygments
      - name: Markdown check
        run: python3 tools/check_site.py site
      - name: PDFs (into site/pdf, git-ignored, so the sitemap lists them)
        run: python3 tools/render_pdf.py --all site site/pdf
      - name: Build
        run: bundle exec jekyll build -s site -d _site
        env:
          JEKYLL_ENV: production
      - name: Internal links and anchors
        run: bundle exec htmlproofer ./_site --disable-external --swap-urls '^/tacctl/:/'
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
