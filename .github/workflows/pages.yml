name: docs-site
on:
  push:
    branches: ["gh-pages"]
  pull_request:
    branches: ["gh-pages"]
  workflow_dispatch:
    inputs:
      external:
        description: "Also check external links (html-proofer, results cached for two weeks)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter fonts-dejavu-core \
              libpango-1.0-0 libpangoft2-1.0-0
          pip install --break-system-packages weasyprint markdown pygments
      - name: Markdown check
        run: python3 tools/check_site.py site
      - name: Command check (man/tacctl.1 at the release each page names)
        run: |
          tags=$(python3 tools/check_commands.py --tags-needed site)
          if [ -n "$tags" ]; then
            git fetch --no-tags --depth 1 origin $(printf 'tag %s ' $tags)
          fi
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_commands.py site
      - name: PDFs (into site/pdf, git-ignored, so the sitemap lists them)
        run: python3 tools/render_pdf.py --all site site/pdf
      - name: Build
        run: bundle exec jekyll build -s site -d _site
        env:
          JEKYLL_ENV: production
      - name: Internal links and anchors
        run: bundle exec htmlproofer ./_site --disable-external --swap-urls '^/tacctl/:/'
      - if: github.event_name == 'workflow_dispatch' && inputs.external
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/.htmlproofer
          key: htmlproofer-${{ github.run_id }}
          restore-keys: htmlproofer-
      - name: External links (manual runs with external, two-week cache)
        if: github.event_name == 'workflow_dispatch' && inputs.external
        run: >-
          bundle exec htmlproofer ./_site --swap-urls '^/tacctl/:/'
          --cache '{"timeframe":{"external":"2w"}}'
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
