# The Go tests, on a pull request and on a push to develop. master is not
# listed: after a release it holds develop's files, and the release is a pull
# request first (docs/releasing.md). The bats suite, the diff corpus and the
# container matrix need a root-owned host and stay on the maintainer's
# machines (tests/README.md).
# The tag 0.2.2 is fetched (fetch-tags): two tests build or read it and skip
# without it. internal/cli takes over twenty minutes in one piece, so it
# runs in four shards (tests/tools/go-test-shard.sh); every other package
# is one job. Each runs twice, as 'make test-go' does: without tags and
# with the test knobs.
name: test

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Go
        id: go
        run: |
          v=$(sed -n 's/^GO_VERSION="\([0-9.]*\)"$/\1/p' bin/tacctl.sh)
          [ -n "$v" ] || { echo "no GO_VERSION in bin/tacctl.sh" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: false
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: go vet
        run: |
          go vet ./...
          go vet -tags testknobs ./...
      - name: The shards hold every test of internal/cli once
        run: tests/tools/go-test-shard.sh --check 4

  other-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tags: ["", testknobs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Go
        id: go
        run: |
          v=$(sed -n 's/^GO_VERSION="\([0-9.]*\)"$/\1/p' bin/tacctl.sh)
          [ -n "$v" ] || { echo "no GO_VERSION in bin/tacctl.sh" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: false
          cache: false
      - name: Link it as /usr/local/go
        run: |
          sudo rm -rf /usr/local/go
          sudo ln -s "$(go env GOROOT)" /usr/local/go
      - name: Tests (everything but internal/cli), with the race detector
        env:
          CGO_ENABLED: "1"
          LANG: C.UTF-8
        run: |
          pkgs=$(go list ./... | grep -v '/internal/cli$')
          # shellcheck disable=SC2086
          setsid -w go test -race -tags "${{ matrix.tags }}" $pkgs </dev/null

  cli-shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        tags: ["", testknobs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Go
        id: go
        run: |
          v=$(sed -n 's/^GO_VERSION="\([0-9.]*\)"$/\1/p' bin/tacctl.sh)
          [ -n "$v" ] || { echo "no GO_VERSION in bin/tacctl.sh" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: false
          cache: false
      - name: Link it as /usr/local/go
        run: |
          sudo rm -rf /usr/local/go
          sudo ln -s "$(go env GOROOT)" /usr/local/go
      - name: internal/cli, shard ${{ matrix.shard }} of 4
        env:
          LANG: C.UTF-8
          GOFLAGS: ${{ matrix.tags != '' && format('-tags={0}', matrix.tags) || '' }}
        run: tests/tools/go-test-shard.sh ${{ matrix.shard }} 4
