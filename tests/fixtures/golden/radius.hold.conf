	authorize {
		update request {
			&Tmp-String-0 := "c5387b848455567c/%{client:tacctl_scope}"
		}
		tacctl_users
		if (!ok) {
			update request {
				&Tmp-String-1 := "not an enabled user of this scope"
			}
			tacctl_reject
		}
		tacctl_pap
	}
	authenticate {
		tacctl_pap
	}
	post-auth {
		# A filtered packet (tacctl_filter) gets no answer and no line in the auth log.
		if (!&control:Response-Packet-Type) {
			# Vendor attributes: only for a client whose scope enables the vendor
			# ('tacctl scope vendor-attrs') or whose address is tagged with it
			# ('tacctl scope devices'). The values come from the control list.
			# A group's Junos deny sets ('tacctl group junos') go with its login class.
			if (("%{client:tacctl_send_cisco}" == "yes") && &control:Tacctl-Priv-Lvl) {
				update reply {
					&Cisco-AVPair := "shell:priv-lvl=%{control:Tacctl-Priv-Lvl}"
				}
			}
			if (("%{client:tacctl_send_juniper}" == "yes") && &control:Tacctl-Juniper-Class) {
				update reply {
					&Juniper-Local-User-Name := &control:Tacctl-Juniper-Class
				}
				if (&control:Tacctl-Juniper-Deny-Commands) {
					update reply {
						&Juniper-Deny-Commands := &control:Tacctl-Juniper-Deny-Commands
					}
				}
				if (&control:Tacctl-Juniper-Deny-Configuration) {
					update reply {
						&Juniper-Deny-Configuration := &control:Tacctl-Juniper-Deny-Configuration
					}
				}
			}
			if (("%{client:tacctl_send_wti}" == "yes") && &control:Tacctl-WTI-Super) {
				update reply {
					&WTI-Super := &control:Tacctl-WTI-Super
				}
			}
			tacctl_auth
		}
		Post-Auth-Type REJECT {
			update reply {
				&Service-Type !* ANY
				&Cisco-AVPair !* ANY
				&Juniper-Local-User-Name !* ANY
				&Juniper-Deny-Commands !* ANY
				&Juniper-Deny-Configuration !* ANY
				&WTI-Super !* ANY
			}
			tacctl_auth
		}
	}
	preacct {
	}
	accounting {
		tacctl_acct
	}
