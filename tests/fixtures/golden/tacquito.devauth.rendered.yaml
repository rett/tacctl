# GENERATED by tacctl from /etc/tacctl/store.yaml and tacctl.yaml. Edits here are overwritten.
# Use tacctl commands, or 'tacctl store import --replace' to adopt manual edits.
#
# Tacquito TACACS+ server configuration (Cisco IOS/IOS-XE + Juniper).

# --- Type constants ---
authenticator_type_bcrypt: &authenticator_type_bcrypt 1
action_deny:  &action_deny  1
action_permit: &action_permit 2
accounter_type_file: &accounter_type_file 3
handler_type_start: &handler_type_start 1
provider_type_prefix: &provider_type_prefix 1

# --- Accounting ---
file_accounter: &file_accounter
  name: tacquito_accounter
  type: *accounter_type_file

# --- Per-user bcrypt authenticators ---
# A disabled account and the 'root' accounting sink carry a well-formed
# hash that no password matches.

bcrypt_alice: &bcrypt_alice
  type: *authenticator_type_bcrypt
  options:
    hash: 24326224313224646f6e74636172652e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e

bcrypt_bob: &bcrypt_bob
  type: *authenticator_type_bcrypt
  options:
    hash: 24326224313224646f6e74636172652e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e

bcrypt_dave: &bcrypt_dave
  type: *authenticator_type_bcrypt
  options:
    hash: 24326224313224646f6e74636172652e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e

# --- Services ---
# Cisco IOS/IOS-XE sends service=shell for exec authorization and expects
# priv-lvl; the anchors keep 'exec' as the label for the tier.
# Juniper requests service=junos-exec and expects local-user-name.
# Each device type only requests its own service; the other is ignored.
# A WTI unit with Service Name 'wti' requests service=wti (a group with a
# WTI level of its own); deny-* are the Junos deny sets of the group.

# Cisco exec - readonly (priv-lvl 1)
exec_readonly: &exec_readonly
  name: shell
  set_values:
    - name: priv-lvl
      values: [1]

# Juniper junos-exec - readonly
# "RO-CLASS" must match a local template user on Juniper devices
junos_exec_readonly: &junos_exec_readonly
  name: junos-exec
  set_values:
    - name: local-user-name
      values: ["RO-CLASS"]

# Cisco exec - operator (priv-lvl 7)
exec_operator: &exec_operator
  name: shell
  set_values:
    - name: priv-lvl
      values: [7]

# Juniper junos-exec - operator
# "OP-CLASS" must match a local template user on Juniper devices
junos_exec_operator: &junos_exec_operator
  name: junos-exec
  set_values:
    - name: local-user-name
      values: ["OP-CLASS"]
    - name: deny-commands
      values: ["(^(file (delete|rename|copy|archive)|request|start|load|op|test|configure|edit|clear (system|security|network-access)|monitor traffic .*write-file|show (system (login|rollback)|configuration .*(root-auth|login|tacplus|radius).*))( .*)?$)"]

# Cisco exec - superuser (priv-lvl 15)
exec_superuser: &exec_superuser
  name: shell
  set_values:
    - name: priv-lvl
      values: [15]

# Juniper junos-exec - superuser
# "RW-CLASS" must match a local template user on Juniper devices
junos_exec_superuser: &junos_exec_superuser
  name: junos-exec
  set_values:
    - name: local-user-name
      values: ["RW-CLASS"]

# Cisco exec - engineer (priv-lvl 15)
exec_engineer: &exec_engineer
  name: shell
  set_values:
    - name: priv-lvl
      values: [15]

# Juniper junos-exec - engineer
# "EN-CLASS" must match a local template user on Juniper devices
junos_exec_engineer: &junos_exec_engineer
  name: junos-exec
  set_values:
    - name: local-user-name
      values: ["EN-CLASS"]
    - name: deny-commands
      values: ["(^(request (system (reboot|halt|power-off|zeroize|software|snapshot|storage|scripts)|chassis routing-engine|vmhost|security)|start|load|op|file (copy|delete|rename|archive|show)|clear system login|restart (chassis|management).*)( .*)?$)"]
    - name: deny-configuration
      values: ["(^(groups [^ ]+ )?(system (login|root-auth|authentication|tacplus|radius|accounting|services|scripts|archival|master|ports)|snmp|event-options|security (ike|ipsec|ssh|cert|pki)|interfaces (fxp0|em0|me0|vme)))"]

# WTI wti - engineer (priv-lvl 10, SuperUser; 'tacctl group edit engineer wti-level')
wti_exec_engineer: &wti_exec_engineer
  name: wti
  set_values:
    - name: priv-lvl
      values: [10]

# --- Groups ---
# Command rules come from commands.<group> in tacctl.yaml.
readonly: &readonly
  name: readonly
  services:
    - *exec_readonly
    - *junos_exec_readonly
  commands:
    - name: "show"
      match: ["^(?:^(running-config view full)( .*)?$)$"]
      action: *action_deny
    - name: "show"
      action: *action_permit
    - name: "dir"
      action: *action_permit
    - name: "ping"
      action: *action_permit
    - name: "traceroute"
      action: *action_permit
    - name: "terminal"
      match: ["^(?:^(length|width)( .*)?$)$"]
      action: *action_permit
    - name: "exit"
      action: *action_permit
    - name: "logout"
      action: *action_permit
    - name: "*"
      action: *action_deny
  accounter: *file_accounter

operator: &operator
  name: operator
  services:
    - *exec_operator
    - *junos_exec_operator
  commands:
    - name: "show"
      match: ["^(?:^(running-config view full)( .*)?$)$"]
      action: *action_deny
    - name: "show"
      action: *action_permit
    - name: "dir"
      action: *action_permit
    - name: "ping"
      action: *action_permit
    - name: "traceroute"
      action: *action_permit
    - name: "terminal"
      action: *action_permit
    - name: "ssh"
      action: *action_permit
    - name: "telnet"
      action: *action_permit
    - name: "monitor"
      match: ["^(?:^(capture)( .*)?$)$"]
      action: *action_permit
    - name: "clear"
      match: ["^(?:^(counters|line|(ip )?arp \\S+|arp-cache \\S+|mac address-table dynamic \\S+)( .*)?$)$"]
      action: *action_permit
    - name: "undebug"
      action: *action_permit
    - name: "exit"
      action: *action_permit
    - name: "logout"
      action: *action_permit
    - name: "*"
      action: *action_deny
  accounter: *file_accounter

superuser: &superuser
  name: superuser
  services:
    - *exec_superuser
    - *junos_exec_superuser
  commands:
    - name: "*"
      action: *action_permit
  accounter: *file_accounter

engineer: &engineer
  name: engineer
  services:
    - *exec_engineer
    - *junos_exec_engineer
    - *wti_exec_engineer
  accounter: *file_accounter

# --- Users ---
users:

  # alice
  - name: alice
    scopes: ["lab"]
    groups: [*superuser]
    authenticator: *bcrypt_alice
    accounter: *file_accounter

  # bob
  - name: bob
    scopes: ["lab"]
    groups: [*operator]
    authenticator: *bcrypt_bob
    accounter: *file_accounter

  # dave
  - name: dave
    scopes: ["lab"]
    groups: [*engineer]
    authenticator: *bcrypt_dave
    accounter: *file_accounter

# --- Secret Providers (Scopes) ---
# One entry per (scope, prefix), most specific prefix first: tacquito
# answers a client with the first entry whose prefix contains it.
secrets:
  - name: lab
    secret:
      group: tacquito
      key: "lab-secret-0123456789abcdef"
    handler:
      type: *handler_type_start
    type: *provider_type_prefix
    options:
      prefixes: |
        [
          "192.0.2.0/24"
        ]
