
WTI Console Server Configuration  (scope: lab, firmware v8.x text interface)
(other scopes: prod,prod-inner,dmz — use --scope <name> to emit those)
Follow these steps on the WTI serial (SetUp) console:
--------------------------------------------

Step 1: Log in on the serial SetUp port as an Administrator-level account
        (factory default: super / super) and reach the Text Interface command
        prompt. Keep this serial session open until Step 7 succeeds.

Step 2: Open the TACACS Parameters menu
        /N [Enter]              Network Parameters (eth0/IPv4 [Shared])
        28 [Enter]              TACACS Parameters -- the item number varies by
                                model/firmware; pick the entry labelled "TACACS"

Step 3: Set each item (type the item number, [Enter], then the value)
         1. Enable                     : On
         2. Primary Host/Address       : 10.0.0.42
         3. Secondary Host/Address     : (leave Undefined -- single tacquito server)
         4. Secret Word                : lab-secret-0123456789abcdef
         5. Fallback Timer             : 15
         6. Fallback Local             : On (Transport Failure)
         7. Authentication Port        : 49
         8. Default User Access        : Enable On, Access Level ViewOnly,
                                         Service Access Telnet/SSH On   (REQUIRED; see notes)
         9. Account Management Module  : Enabled   (TACACS+ authorization -- carries priv-lvl back; REQUIRED)
        10. Session Management Module  : Enabled   (TACACS+ accounting -- needs tacctl's tacquito patch 0002)
        11. Service Name               : shell     (factory default is "wti"; see notes below)
        12. Debug                      : Off       (turn On only while troubleshooting)

Step 4: Ping test
        13. Ping TACACS Servers        -- confirms 10.0.0.42 answers ICMP from the unit.
                                          ICMP only: a pass does NOT prove TCP/49 works (Step 5)

Step 5: Check the unit's firewall (IP Tables under /N)
        If the IP Tables list sets 'iptables -P INPUT DROP' or ends in
        'iptables -A INPUT -j DROP', it must also accept loopback and replies
        to the unit's own connections, BEFORE the final DROP:
          iptables -A INPUT -i lo -j ACCEPT
          iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        (older builds: -m state --state ESTABLISHED,RELATED). Without them the
        unit's TACACS+ SYN leaves but tacquito's SYN-ACK is dropped: every
        login waits out the Fallback Timer and tacquito logs nothing.

Step 6: Save
        Press [Esc] repeatedly until the unit prints "Saving Configuration"
        and returns to the command prompt.

Step 7: Test from a SECOND session -- keep the Step 1 serial session open as a
        back door until this works. Log in with a tacquito user that is a member
        of scope 'lab', forcing the password method first:
          ssh -o PreferredAuthentications=password <user>@<wti-ip>
        then type /H: the Help menu lists only the commands allowed for the
        access level the server assigned (see the mapping below). Log out with
        /X so the accounting STOP record is sent.
        If a plain 'ssh <user>@<wti-ip>' is closed without a password prompt
        while the password method works, the unit's Invalid Access Lockout is
        armed from earlier failures: /UL clears it.

Step 8: Only if Step 7 fails -- turn on the unit's TACACS debug
        /N, 28, then 12. Debug: On, [Esc] to save. Retry the Step 7 login: the
        unit now echoes each TACACS+ exchange (PAP authentication, then the
        authorization that returns priv-lvl, then accounting) on THIS serial
        session. Read it next to tacquito's debug log (see "Verify" below),
        then set 12. Debug back to Off and [Esc] to save.
        Session dropped ("Broken pipe") right after login, no accounting STOP:
        the tacquito binary lacks patch 0002 -- run 'tacctl upgrade', or set
        10. Session Management Module: Disabled until it is rebuilt.

--------------------------------------------
Group → WTI Access Level Mapping (from priv-lvl):
  readonly: priv-lvl 1 → ViewOnly
  operator: priv-lvl 7 → User
  superuser: priv-lvl 15 → Administrator
  (WTI bands: 0-4 ViewOnly, 5-9 User, 10-14 SuperUser, 15 Administrator)
  No group lands in the SuperUser band; to grant it, add a group at
  priv-lvl 10-14, e.g. 'tacctl group add wtisuper 12 OP-CLASS'.

Notes:
  - WTI authenticates with PAP (password travels inside the TACACS+ body,
    obfuscated with the shared secret) — tacquito's bcrypt authenticator
    handles PAP, no server-side change needed
  - The Account/Session Management Module items are PAM terms (the unit's
    client is pam_tacplus-style): 'Account' is the TACACS+ authorization
    request that carries priv-lvl back — without it every login gets the
    'Default User Access' level; 'Session' is accounting start/stop
  - Service Name 'shell' makes the unit's authorization request match
    tacquito's configured service directly. Leaving the factory 'wti' also
    works, but only via the default-service-permit patch (patches/0001),
    which answers an unmatched service with the group's shell priv-lvl
  - Default User Access must be On (Access Level ViewOnly is only the floor;
    the priv-lvl tacquito returns sets the effective level). SSH logins go
    through the unit's OpenSSH, which must resolve the account locally: with
    it Off, a TACACS-only user is invalid to sshd, which sends a junk password
    (OpenSSH's 'INCORRECT' filler) — tacquito then logs 'failed to validate
    the user' on every attempt whatever was typed, and a plain ssh is closed
    unprompted
  - Session Management (accounting) needs tacquito built with tacctl's patch
    0002 (patches/): upstream answers accounting with a non-empty server_msg,
    and the unit drops the SSH session right after login when it gets one.
    'tacctl upgrade' applies the patch overlay and rebuilds
  - Port and service access for User/ViewOnly-level logins (priv-lvl 0-9) is
    defined only under 8. Default TACACS User Access → Configure Port Access /
    Service Access (factory: Administrator+SuperUser all ports, User+ViewOnly
    none). If such a login lands at the right level but reaches no ports,
    grant them there. A same-named LOCAL account on the unit overrides the
    server-assigned level — keep the two directories disjoint
  - Fallback Local 'On (Transport Failure)' mirrors this scope's aaa-order;
    keep a local Administrator account on the unit as break-glass. It acts
    only after the TACACS+ transport fails (Fallback Timer expiry), not on an
    immediate 'Connection closed' or 'Permission denied'
  - A firewall that drops tacquito's replies (the unit's own IP Tables
    without ESTABLISHED,RELATED — Step 5) shows up on the server only as
    SYNs in tcpdump and half-open (SYN-RECV) sockets; tacquito logs nothing
  - The unit's source IP must fall inside a prefix of scope 'lab'
    ('tacctl scope lookup <wti-ip>' to check)
  - Using template: <TACCTL_SRC>/config/templates/wti.template

Verify on the tacquito side:
  tacctl config loglevel debug          # then log in on the WTI (Step 7) and watch:
  tacctl log tail 50                    # 1. 'accepting user [x] using a bcrypt password'  (PAP authen)
                                        # 2. 'session authz user [x]: client args [service=shell ...]'
                                        # 3. 'authorized user [x] as session based; args [priv-lvl=N]'
  tacctl log accounting                 # start record at login, stop record after /X
  tacctl log failures                   # 'bad secret detected' = Secret Word mismatch;
                                        # 'failed to validate the user [x] using a bcrypt
                                        # password' on EVERY attempt = Default User Access Off;
                                        # 'unknown authenticate start packet type' = unit did not
                                        # send PAP with TACACS+ minor version 1 (open an issue)
  tacctl config loglevel info           # restore when done
  On the WTI (Step 8): with 12. Debug: On the unit echoes each TACACS+ exchange on
  the serial session; line up the authen/author/acct replies with the entries above

