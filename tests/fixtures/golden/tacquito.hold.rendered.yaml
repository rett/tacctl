      match: ["^(?:^((vrf \\S+ )?(ip |ipv6 )?\\S+( (source \\S+|size [1-9]\\d?\\d?\\d?|df-bit|repeat ([1-9]\\d?\\d?|1000)|timeout ([1-9]|10)|data (0x)?[0-9a-fA-F]+|validate))*|mpls (ipv4|pseudowire) \\S+( \\d+)?)$)$"]
