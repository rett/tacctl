      match: ["^(?:^((vrf \\S+ )?(ip|ipv6|mpls|clns|tag|appletalk|ipx|srb|decnet|vines|oldvines|xns|apollo)( (source|size|df-bit|repeat|timeout|data|validate)( .*)?)?|vrf \\S+)$)$"]
      action: *action_deny
