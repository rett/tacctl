      action: *action_permit
    - name: "terminal"
      action: *action_permit
    - name: "ssh"
      action: *action_permit
    - name: "telnet"
      action: *action_permit
    - name: "undebug"
      action: *action_permit
    - name: "exit"
      action: *action_permit
    - name: "logout"
      action: *action_permit
    - name: "*"
      action: *action_deny
  accounter: *file_accounter

superuser: &superuser
  name: superuser
  services:
    - *exec_superuser
    - *junos_exec_superuser
  commands:
    - name: "*"
      action: *action_permit
  accounter: *file_accounter

