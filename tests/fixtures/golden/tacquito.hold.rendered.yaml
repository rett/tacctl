      match: ["^(?:^((vrf \\S+ )?(ip|ipv6|mpls|clns|tag|appletalk|ipx|srb|decnet|vines|oldvines|xns|apollo)( (source|numeric|probe|ttl|timeout)( .*)?)?|vrf \\S+)$)$"]
      action: *action_deny
    - name: "traceroute"
      match: ["^(?:^((vrf \\S+ )?(ip |ipv6 )?\\S+( (source \\S+|numeric|probe ([1-9]|10)|timeout ([1-9]|10)|ttl ([1-9]\\d?|1\\d\\d|2[0-4]\\d|25[0-5])( ([1-9]\\d?|1\\d\\d|2[0-4]\\d|25[0-5]))?))*|mpls (ipv4|pseudowire) \\S+( \\d+)?)$)$"]
      action: *action_permit
    - name: "terminal"
      match: ["^(?:^(length|width)( .*)?$)$"]
      action: *action_permit
    - name: "exit"
      action: *action_permit
