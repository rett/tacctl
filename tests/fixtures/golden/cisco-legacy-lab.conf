
Cisco IOS / IOS-XE Configuration  (scope: lab)
(other scopes: prod-inner,prod,dmz - use --scope <name> to emit those)
Copy and paste into the device:
--------------------------------------------

! --- Step 0: hardening checklist and the local enable secret ---
! Site policy, as comments: tacctl does not compare or plan these lines and keeps no value for them.
! Type what your site uses before the steps below; a line marked (below) is typed there.
! Global:
!   hostname <HOSTNAME>
!   ip domain name <DOMAIN>
!   no ip domain lookup
!   service password-encryption                      (below, with the server block)
!   service timestamps debug datetime msec localtime
!   service timestamps log datetime msec localtime
!   no service pad
!   no ip source-route
!   no ip http server
!   no ip http secure-server
!   ip ssh version 2
!   ip ssh time-out 60
!   ip ssh authentication-retries 3
! On line con 0 and line vty 0 15:
!   transport input ssh                              (below, the vty lines)
!   exec-timeout 60 0                                (below)
!   logging synchronous
! The local enable secret. With the server up, 'enable' asks the server first (Step 1), so the secret
! is never typed by a person; it is the way up only when no server answers. Set it before AAA:
!   no enable password
!   enable secret <PASSWORD>
!
! No break-glass local user is recorded for scope 'lab': with the server
! unreachable and no local account on the device, nobody can log in. Record one with
!   tacctl scope breakglass lab add <name> [--role admin|operator|readonly]
!
! --- Step 1: TACACS+ server, group and AAA (the standard block, legacy IOS 12.x syntax) ---
! The order keeps the session you paste from alive: 'aaa new-model' first (nothing under 'aaa'
! exists on IOS until it is set), then the server and its group, the login lists, exec
! authorization and 'enable'. Command authorization is not in this step: it is Step 2, after a
! check from a new session (below), because a server that answers 'fail' (for a name it does not
! know, such as the local user you paste from) is final and never falls through to 'local'. From
! 'aaa new-model' until the login lists are typed a NEW TACACS+ login would fail (a local user
! still gets in): paste the block in one go and keep the session you paste from.
! Encrypt Type 0 plaintext secrets in the running-config as Type 7.
! (Type 7 is trivially reversible; Type 6 AES key encryption is NOT
!  available on IOS 12.4 - only Type 0/7 apply on this train.)
service password-encryption
!
aaa new-model
!
! Legacy global TACACS+ syntax. The structured 'tacacs server <name>' block
! (address ipv4 / key / single-connection) is IOS 15.0+ and is NOT available here.
tacacs-server host 10.0.0.42 single-connection timeout 5 key lab-secret-0123456789abcdef
!
aaa group server tacacs+ TACACS-GROUP
  server 10.0.0.42
!
! Source interface not set for scope lab: the server matches this device by its source
! address, so a stable management interface is worth setting. Once, for the scope:
!   tacctl config cisco source-interface lab <interface>
! then render this again to get the line:  ip tacacs source-interface <interface>
!
! 'default' is the vty lines' login list; CONSOLE is the console's, local only: with the
! server up a local user logs in on the console, and lands at privilege 1 (see Notes below).
aaa authentication login default group TACACS-GROUP local
aaa authentication login CONSOLE local
aaa authorization exec default group TACACS-GROUP local if-authenticated
! 'enable' asks the server first (a TACACS+ user lands at the level the server gives, and needs
! no 'enable'); the local enable secret answers only when no server does.
aaa authentication enable default group TACACS-GROUP enable
aaa accounting exec default start-stop group TACACS-GROUP
aaa accounting commands 1 default start-stop group TACACS-GROUP
aaa accounting commands 7 default start-stop group TACACS-GROUP
aaa accounting commands 15 default start-stop group TACACS-GROUP
aaa session-id common
!
! --- readonly - Privilege Level 1 Commands ---
privilege exec level 1 show running-config
!
! --- operator - Privilege Level 7 Commands ---
privilege exec level 7 undebug all
!
! --- SNMP ---
! SNMP is not configured in tacctl for scope 'lab': nothing is rendered here.
! Set it up on the tacctl server, then run this command again:
!   tacctl scope snmp lab community       (v2c)
!   tacctl scope snmp lab v3-user <user>  (v3, authPriv)
!   tacctl config snmp community|v3-user  (the default for every scope that sets none)
!
! VTY-ACL not emitted - mgmt-acl list is empty.
! Populate it on the tacctl server with
!   tacctl config mgmt-acl add <cidr>
! then re-run 'tacctl config cisco' to get the access-list block.
!
! --- NETCONF ---
! NETCONF (netconf-yang) does not exist on IOS 12.x.
!
line con 0
  login authentication CONSOLE
  exec-timeout 60 0
!
line vty 0 15
  login authentication default
  transport input ssh
! access-class VTY-ACL in   ! uncomment after populating mgmt-acl
  exec-timeout 60 0
!
! --- Check: before Step 2, from a NEW session ---
! Open a new session to this device with your own TACACS+ account (not the one you pasted
! from: that is a local user the server does not know) and run:  show privilege
! It must say the level the server gives your group (15 for a superuser). If the login is
! refused or the level is wrong, stop: put the server path right first (the key, the address,
! the source interface, the user's group) and leave Step 2 for later.
!
! --- Step 2: command authorization ---
! Typed only after the check. The session that pastes is a local user the server does not
! know: from the first line below every command of every session is asked of the server,
! which answers 'fail' for such a name and never falls through to 'local' (a break-glass
! local user is refused the same way while a server answers). Type these lines as the user
! of the new session, and keep a second session logged in.
! Per-command authorization (managed by 'tacctl group commands'): one line per
! privilege level in use; the server decides each command, including configuration
! commands, which IOS sends as ordinary commands.
aaa authorization commands 1 default group TACACS-GROUP local
aaa authorization commands 7 default group TACACS-GROUP local
aaa authorization commands 15 default group TACACS-GROUP local
aaa authorization config-commands
! Do NOT set 'aaa authorization console': the console would be authorized by the default lists,
! server first, which defeats the CONSOLE list.

--------------------------------------------
Group -> Privilege Level Mapping:
  readonly: priv-lvl 1
  operator: priv-lvl 7
  superuser: priv-lvl 15

Notes:
  - The 'local' fallback ensures access if TACACS+ is unreachable
  - Ensure a local admin account exists as a backup (Step 0)
  - The console has its own login list, CONSOLE (local only): a local user can log in there
    whatever the server says, and lands at privilege 1 ('aaa authorization console' is not
    set, and must not be: it would put the console under the default lists, server first)
  - 'enable' asks the server first, which refuses a name it does not know and does not fall
    through to the local secret: on the console a local user reaches privilege 15 only while
    no server answers
  - Nobody needs 'enable': a TACACS+ user lands at the level the server gives (an operator who
    types it is refused there, by design)
  - VTY-ACL permits are managed with 'tacctl config mgmt-acl add <cidr>'
  - Type 6 (AES) key encryption is NOT available on IOS 12.x;
    'service password-encryption' stores the key as Type 7.
  - Manage 'privilege exec level' mappings with 'tacctl group privilege add ...'
    (defaults move only the verified priv-15 commands DOWN; nothing is moved UP)
  - Step 2 (command authorization) is typed after the check, from a new session with your own
    account: the session that pastes is a local user the server does not know, and the server's
    'fail' is final, so that session (and a break-glass local user) is refused every command
    while a server answers
  - A group at priv-lvl 15 is kept apart from the superusers only by the server's
    rules: with the server unreachable, the 'local' fallback lets it run everything
  - Commands typed on the console line are not sent to the server for authorization
    ('aaa authorization console' is not set)
  - Using template: built-in cisco-legacy.template

