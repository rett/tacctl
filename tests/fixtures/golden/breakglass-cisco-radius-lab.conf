
Cisco IOS / IOS-XE Configuration  (scope: lab, protocol: RADIUS)
(other scopes: prod-inner,prod,dmz - use --scope <name> to emit those)
Copy and paste into the device:
--------------------------------------------

! --- Step 0: hardening checklist and the local enable secret ---
! Site policy, as comments: tacctl does not compare or plan these lines and keeps no value for them.
! Type what your site uses before the steps below; a line marked (below) is typed there.
! Global:
!   hostname <HOSTNAME>
!   ip domain name <DOMAIN>
!   no ip domain lookup
!   service password-encryption                      (below, with the server block)
!   service timestamps debug datetime msec localtime
!   service timestamps log datetime msec localtime
!   no service pad
!   no ip source-route
!   no ip http server
!   no ip http secure-server
!   ip ssh version 2
!   ip ssh time-out 60
!   ip ssh authentication-retries 3
! On line con 0 and line vty 0 15:
!   transport input ssh                              (below, the vty lines)
!   exec-timeout 60 0                                (below)
!   logging synchronous
! The local enable secret. Whether a RADIUS server answers 'enable' is not verified (Step 1 leaves the
! enable list commented): until a list is typed, 'enable' uses this secret. Set it before AAA:
!   no enable password
!   enable algorithm-type scrypt secret <PASSWORD>
!
! --- Break-glass local users (scope: lab) ---
! The 'local' method of 'aaa authentication login' in Step 1 admits these only when no
! server answers.
! The console's own list, CONSOLE, is local only: these accounts log in there whatever the server says,
! at privilege 1 while a server answers (see the Notes under the configuration).
! tacctl stores no credential: replace <TYPE9-HASH> with the type 9 hash ($9$...) of a password
! you keep (the hash, not the password: 'secret 9' takes a hash as it appears in 'show running-config'),
! then remove the '! '.
! username lab-admin privilege 15 secret 9 <TYPE9-HASH>
! username lab-ops privilege 7 secret 9 <TYPE9-HASH>
! username lab-ro privilege 1 secret 9 <TYPE9-HASH>
!
! --- Step 1: RADIUS server, group and AAA (the standard block, where RADIUS has it) ---
! The order keeps the session you paste from alive: 'aaa new-model' first (nothing under 'aaa'
! exists on IOS until it is set), then the server and its group, the login lists and exec
! authorization. RADIUS has no command authorization. From 'aaa new-model' until the login lists
! are typed a NEW RADIUS login would fail (a local user still gets in): paste the block in one go
! and keep the session you paste from.
! Encrypt Type 0 plaintext secrets in running-config.
! (Type 7 is trivially reversible; for Type 6 AES encryption of the
!  RADIUS key, run 'key config-key password-encrypt <master>' first,
!  then re-enter the key with 'key 6 <encrypted-string>'.)
service password-encryption
!
aaa new-model
!
radius server RADIUS
  address ipv4 10.0.0.42 auth-port 1812 acct-port 1813
  key lab-secret-0123456789abcdef
  timeout 5
  retransmit 2
!
aaa group server radius RADIUS-GROUP
  server name RADIUS
!
! Source interface not set for scope lab: the server matches this device by its source
! address, so a stable management interface is worth setting. Once, for the scope:
!   tacctl config cisco source-interface lab <interface>
! then render this again to get the line:  ip radius source-interface <interface>
!
! 'default' is the vty lines' login list; CONSOLE is the console's, local only: with the
! server up a local user logs in on the console, and lands at privilege 1 (see Notes below).
aaa authentication login default group RADIUS-GROUP local
aaa authentication login CONSOLE local
aaa authorization exec default group RADIUS-GROUP local if-authenticated
! 'enable' against a RADIUS server is NOT VERIFIED (lab item E2): IOS sends the user enab15 and
! what your server answers is unknown. With a reachable server that does not answer enable
! requests positively, 'enable' FAILS; the local enable secret is used only when no server
! answers. Left commented on purpose: type it only after 'enable' is shown to work.
! aaa authentication enable default group RADIUS-GROUP enable
aaa accounting exec default start-stop group RADIUS-GROUP
aaa session-id common
!
! --- readonly - Privilege Level 1 Commands ---
privilege exec level 1 show running-config
!
! --- operator - Privilege Level 7 Commands ---
privilege exec all level 7 ping
privilege exec all level 7 traceroute
privilege exec all level 7 monitor capture
privilege exec level 7 clear counters
privilege exec level 7 clear line
privilege exec level 7 clear ip arp
privilege exec level 7 clear arp-cache
privilege exec level 7 clear mac address-table dynamic
privilege exec level 7 undebug all
!
! --- SNMP ---
! SNMP is not configured in tacctl for scope 'lab': nothing is rendered here.
! Set it up on the tacctl server, then run this command again:
!   tacctl scope snmp lab community       (v2c)
!   tacctl scope snmp lab v3-user <user>  (v3, authPriv)
!   tacctl config snmp community|v3-user  (the default for every scope that sets none)
!
! VTY-ACL not emitted - mgmt-acl list is empty.
! Populate it on the tacctl server with
!   tacctl config mgmt-acl add <cidr>
! then re-run 'tacctl config cisco --protocol radius' to get the access-list block.
!
! --- NETCONF (optional; IOS-XE; review, then uncomment) ---
! Prerequisite: exec authorization above ('aaa authorization exec default ...') and a
! privilege 15 user, because NETCONF logs in over ssh and takes its privilege from them.
! netconf-yang
! Check: show netconf-yang status
!        ssh -p 830 -s <user>@<device> netconf     (expect a <hello> from the device)
!
line con 0
  login authentication CONSOLE
  exec-timeout 60 0
!
line vty 0 15
  login authentication default
  transport input ssh
! access-class VTY-ACL in   ! uncomment after populating mgmt-acl
  exec-timeout 60 0

--------------------------------------------
Group -> Privilege Level Mapping:
  readonly: priv-lvl 1
  operator: priv-lvl 7
  superuser: priv-lvl 15

What an Access-Accept carries for this device:
  - Service-Type: Administrative-User at privilege 15, else NAS-Prompt-User (always sent)
  - Cisco-AVPair "shell:priv-lvl=N" from the user's group: the scope enables it (tacctl scope vendor-attrs lab); an address tagged with another vendor gets that one's instead
  - No other vendor's attribute. A reject carries none

What RADIUS does not give you (compared with TACACS+):
  - No per-command authorization. The only authorization is what the Access-Accept
    carries: the privilege level (Cisco-AVPair shell:priv-lvl=N, with Service-Type).
    'tacctl group commands' rules are not enforced; a user may run whatever their
    privilege level allows, so review the 'privilege exec level' mappings above
  - No command accounting. Only exec session start/stop records are sent
    (TACACS+ also records every command at each privilege level in use)
  - Password logins only (PAP): no CHAP, MS-CHAP or EAP
  - UDP, not TCP/49: allow UDP 1812 (authentication) and 1813 (accounting)
    from the device to the server
  - The server answers only a device whose source address lies in a prefix of scope
    'lab' ('tacctl scope lookup <device-ip>' to check)

Notes:
  - The 'local' fallback ensures access if the RADIUS server is unreachable;
    a reject from the server does not fall through to local
  - Ensure a local admin account exists as a backup (Step 0)
  - The console has its own login list, CONSOLE (local only): a local user can log in there
    whatever the server says, and lands at privilege 1 ('aaa authorization console' is not
    set, and must not be: it would put the console under the default lists, server first)
  - 'enable' uses the local enable secret as this walkthrough stands: the enable list is left
    commented (unverified, lab item E2). If you type it, a reachable server that does not answer
    enable requests positively makes 'enable' fail, and the local secret is used only when no
    server answers
  - VTY-ACL permits are managed with 'tacctl config mgmt-acl add <cidr>'
  - For Type 6 (AES) key encryption, run on the device first:
      conf t ; key config-key password-encrypt <master-key>
      password encryption aes
    then re-enter the radius key. (Type 7 is trivially reversible.)
  - Manage 'privilege exec level' mappings with 'tacctl group privilege add ...'
    (defaults move only the verified priv-15 commands DOWN; nothing is moved UP)
  - Using template: built-in cisco-radius.template

Unfilled break-glass credentials (tacctl stores none; put in your own): lab-admin (admin), lab-ops (operator), lab-ro (readonly)

