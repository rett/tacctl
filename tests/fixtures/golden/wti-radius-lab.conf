
WTI Console Server Configuration  (scope: lab, protocol: RADIUS, firmware v8.x text interface)
(other scopes: prod-inner,prod,dmz — use --scope <name> to emit those)
NOT VERIFIED ON A UNIT: this RADIUS walkthrough is written from WTI's documents
(docs/radius-notes.md), not tested on a WTI device. The TACACS+ walkthrough
('tacctl config wti --scope lab --protocol tacacs') was verified on a v8.10 unit.
Follow these steps on the WTI serial (SetUp) console:
--------------------------------------------

Step 1: Log in on the serial SetUp port as an Administrator-level account
        (factory default: super / super) and reach the Text Interface command
        prompt. Keep this serial session open until Step 7 succeeds.

Step 2: Open the RADIUS Parameters menu
        /N [Enter]              Network Parameters (eth0/IPv4 [Shared])
        29 [Enter]              RADIUS Parameters -- 29 in WTI's user guide; the
                                item number varies by model/firmware (the TACACS
                                menu is 28 on the unit tacctl was tested with);
                                pick the entry labelled "RADIUS"

Step 3: Set each item (type the number the menu shows next to the label,
        [Enter], then the value -- WTI does not document the numbers here)
          Enable                        : On
          Primary Host/Address (IPv4)   : 10.0.0.42
          Primary Secret Word           : lab-secret-0123456789abcdef
          Secondary Host/Address        : (leave Undefined -- single tacctl server)
          Fallback Timer                : 3   (factory default: seconds the primary is tried)
          Fallback Local                : On (Transport Failure)
          Retries                       : 3   (factory default)
          Authentication Port           : 1812
          Accounting Port               : 1813
          OneTime Auth                  : Off
          Default RADIUS User Access    : Enable On, Access Level ViewOnly,
                                          Service Access Telnet/SSH On   (see notes)
          Debug                         : Off (turn On only while troubleshooting)
        Leave Session Module Type as it is: WTI does not document what it
        sends, and nothing on the server depends on it.

Step 4: Ping test
          Ping RADIUS Servers           -- confirms 10.0.0.42 answers ICMP from the unit.
                                           ICMP only: a pass does NOT prove UDP 1812 works (Step 5)

Step 5: Check the unit's firewall (IP Tables under /N)
        If the IP Tables list sets 'iptables -P INPUT DROP' or ends in
        'iptables -A INPUT -j DROP', it must also accept loopback and the
        replies to the unit's own requests, BEFORE the final DROP:
          iptables -A INPUT -i lo -j ACCEPT
          iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        (older builds: -m state --state ESTABLISHED,RELATED). The server
        answers over UDP from 10.0.0.42 port 1812 (and 1813).
        Without the rule the unit's requests leave, the answers are dropped,
        and every login waits out the Fallback Timer while the server's auth
        log shows it answered.

Step 6: Save
        Press [Esc] repeatedly until the unit prints "Saving Configuration"
        and returns to the command prompt.

Step 7: Test from a SECOND session -- keep the Step 1 serial session open as a
        back door until this works. Log in with a user that is a member of
        scope 'lab', forcing the password method first:
          ssh -o PreferredAuthentications=password <user>@<wti-ip>
        then type /H: the Help menu lists only the commands allowed for the
        access level the server assigned (see the mapping below). Log out with
        /X. On the server, 'tacctl log tail 20 --backend radius' shows the
        attempt (see "Verify" below).
        If a plain 'ssh <user>@<wti-ip>' is closed without a password prompt
        while the password method works, the unit's Invalid Access Lockout is
        armed from earlier failures: /UL clears it.

Step 8: Only if Step 7 fails -- turn on the unit's RADIUS debug
        /N, 29, then Debug: On, [Esc] to save. Retry the Step 7 login and read
        what the unit logs next to the server's auth log (see "Verify"
        below), then set Debug back to Off and [Esc] to save.

--------------------------------------------
Group → WTI-Super (sent by the server over RADIUS, from priv-lvl):
  readonly: priv-lvl 1 → WTI-Super 0 (ViewOnly)
  operator: priv-lvl 7 → WTI-Super 1 (User)
  superuser: priv-lvl 15 → WTI-Super 3 (Administrator)
  (bands as for TACACS+: 0-4 ViewOnly, 5-9 User, 10-14 SuperUser, 15 Administrator)
  No group lands in the SuperUser band; to grant it, add a group at
  priv-lvl 10-14, e.g. 'tacctl group add wtisuper 12 OP-CLASS'.

What an Access-Accept carries for this device:
  - Service-Type: Administrative-User at privilege 15, else NAS-Prompt-User (always sent)
  - WTI-Super from the user's group: the scope enables it (tacctl scope vendor-attrs lab); an address tagged with another vendor gets that one's instead
  - No other vendor's attribute. A reject carries none

What RADIUS does not give you here:
  - Only the access level. The server sends no WTI-Port-Access, WTI-Plug-Access or
    WTI-Group-Access: which ports and plugs a login reaches is the unit's own setting
    for that level (Default RADIUS User Access → Port/Plug Access, Service Access)
  - No per-command authorization: the access level is all the unit is told
  - Accounting is not verified: whether the unit sends any, and what (Session Module
    Type), is not documented
  - Password logins only (PAP; WTI documents nothing else): no CHAP, MS-CHAP or EAP
  - UDP, not TCP/49: the unit sends to 1812 (authentication) and 1813 (accounting)
  - The server answers only a unit whose source address lies in a prefix of scope
    'lab' ('tacctl scope lookup <wti-ip>' to check)

Where WTI's documents disagree (not checked on a unit):
  - The level a login gets when the Access-Accept carries no WTI-Super: the user's guide
    says Default RADIUS User Access hands out its Access Level (factory default User);
    WTI's knowledge base says View only. This walkthrough sets the level to ViewOnly
    explicitly, and tacctl refuses this walkthrough for a scope that sends no WTI-Super
  - Whether a WTI-Super in the reply overrides a same-named LOCAL account on the unit is not
    documented (for TACACS+ the local account wins): keep the two directories disjoint

Notes:
  - Fallback Local 'On (Transport Failure)' mirrors this scope's aaa-order; keep a local
    Administrator account on the unit as break-glass. With Fallback Local Off (the factory
    default) a unit whose server is unreachable admits nobody over the services RADIUS covers
  - Default RADIUS User Access On (ViewOnly) is the floor, the WTI-Super the server returns
    sets the level. By analogy with TACACS+ (verified there, not here): with it Off the unit's
    OpenSSH treats server-only users as invalid and every SSH login fails
  - A firewall that drops the server's replies (the unit's own IP Tables without
    ESTABLISHED,RELATED -- Step 5) shows on the server as an Access-Accept in the auth log for
    a login that still fails on the unit after the Fallback Timer
  - Repeated failures arm the unit's Invalid Access Lockout: a plain 'ssh' is then closed
    without a password prompt; /UL on the serial session clears it
  - Using template: built-in wti-radius.template

Verify on the server:
  tacctl log tail 20 --backend radius   # one line per attempt: Access-Accept or Access-Reject,
                                        # scope=lab, and nas= -- what the unit sent as its
                                        # NAS-Identifier (else NAS-IP-Address). WTI documents the
                                        # identifier only as starting with the product family
  tacctl log failures --backend radius  # reason= says why a login was refused
  tacctl scope lookup <wti-ip>          # the unit's address must answer scope 'lab'
  On the WTI (Step 8): with Debug On the unit logs its RADIUS exchanges; line them up with
  the server's auth log above

