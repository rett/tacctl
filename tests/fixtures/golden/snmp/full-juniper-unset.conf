
Juniper Junos Configuration  (scope: lab)
(other scopes: prod-inner,prod,dmz — use --scope <name> to emit those)
Copy and paste into the device (configure mode):
--------------------------------------------

# Step 1: Create template users (REQUIRED)
set system login class RO-CLASS permissions network
set system login class RO-CLASS permissions view
set system login class RO-CLASS permissions view-configuration
set system login user RO-CLASS class RO-CLASS
set system login class OP-CLASS permissions clear
set system login class OP-CLASS permissions network
set system login class OP-CLASS permissions trace
set system login class OP-CLASS permissions view
set system login class OP-CLASS permissions view-configuration
set system login user OP-CLASS class OP-CLASS
set system login class RW-CLASS permissions all
set system login user RW-CLASS class RW-CLASS

# Step 2: Configure TACACS+
delete system authentication-order
set system authentication-order tacplus
set system login idle-timeout 60
set system tacplus-server 10.0.0.42 secret lab-secret-0123456789abcdef
set system tacplus-server 10.0.0.42 single-connection
# Optional: pin client source IP for prefix-ACL matching on tacquito.
# Replace 10.0.0.1 with the device's management interface address, e.g.:
#   set system tacplus-server 10.0.0.42 source-address 10.0.0.1
# Accounting events: login + change-log only. 'interactive-commands' is
# intentionally excluded because Junos internal daemons (mgd, jsd,
# health-probe op scripts, etc.) run non-tty CLI commands as root and
# generate a continuous stream of per-command accounting that is pure
# noise on the tacquito side. The login + change-log events still
# capture who logged in and who changed config.
set system accounting events [ login change-log ]
set system accounting destination tacplus

# Step 3: Per-class rules sent by the server at login (read-only summary)
# The classes in Step 1 carry permission bits only. At each login the server
# sends the group's deny values with its class (TACACS+ service junos-exec:
# deny-commands and deny-configuration, next to local-user-name), and Junos
# applies them on top of the class's permissions. Nothing to paste here: they
# are set on the tacctl server ('tacctl group junos <group> ...') and apply at
# the next login.
# class 'RO-CLASS' (group 'readonly')
#   none: tacctl group junos readonly deny-commands add '<regex>'
# class 'OP-CLASS' (group 'operator')
#   none: tacctl group junos operator deny-commands add '<regex>'
# class 'RW-CLASS' (group 'superuser')
#   none: tacctl group junos superuser deny-commands add '<regex>'
# A class set up from the walkthrough of tacctl 0.2.1 or earlier may still hold
# 'tacctl group commands' rules translated into allow-commands/deny-commands.
# Those rules are Cisco's; delete them so only the permission bits and the
# server's values apply, e.g.:
#   delete system login class RO-CLASS allow-commands
#   delete system login class RO-CLASS deny-commands
#   delete system login class OP-CLASS allow-commands
#   delete system login class OP-CLASS deny-commands
#   delete system login class RW-CLASS allow-commands
#   delete system login class RW-CLASS deny-commands

# Step 4: (optional) Management ACL
# mgmt-acl empty — configure with 'tacctl config mgmt-acl add <cidr>' on the tacctl server
# to emit a source-restricted lo0 firewall filter here.

# Step 5: SNMP (read-only, so tacctl can read the device's name and nothing else answers)
# Read-only; managed by tacctl.
# Credentials: this scope's own (tacctl scope snmp lab show --reveal).
# Allowed clients: the tacctl server first, the scope's ranges, then everything else (0.0.0.0/0) refused.
set snmp client-list TACCTL-SNMP 10.0.0.42/32
set snmp client-list TACCTL-SNMP 198.51.100.0/24
set snmp client-list TACCTL-SNMP 0.0.0.0/0 restrict
set snmp community lab-ro-community authorization read-only
set snmp community lab-ro-community client-list-name TACCTL-SNMP
# set snmp location "<location>"   (NOT SET: tacctl device location <name> '<text>')
# set snmp contact "<contact>"   (NOT SET: tacctl scope snmp lab contact '<text>')
# Check from the tacctl server: tacctl scope snmp lab test <device-address>

# Step 6: (optional) NETCONF
# NETCONF over ssh is off by default. Review, then uncomment to enable it:
#   set system services netconf ssh
# Optional limits (uncomment and adjust):
#   set system services netconf ssh connection-limit 5
#   set system services netconf ssh rate-limit 10
# No management filter is rendered (Step 4): when you add one, permit tcp port 830
# next to ssh from the same sources.
# Who may use it is decided by the login class bits of the user (the template users
# of Step 1), not by this step.
# Check after the commit, from a permitted address:
#   ssh -p 830 -s <user>@<device> netconf     (expect a <hello> from the device)
# and on the device:
#   show system connections | match "\.830 "

# Step 7: Break-glass local users (optional, per scope)
# No break-glass local user is recorded for scope 'lab': with the server
# unreachable and no local account on the device, nobody can log in. Record one with
#   tacctl scope breakglass lab add <name> [--role admin|operator|readonly]

# Step 8: Commit
commit

--------------------------------------------
Group → Juniper Class Mapping:
  readonly: RO-CLASS (local: network/view + view-configuration)
  operator: OP-CLASS (local: clear/network/trace/view + view-configuration)
  superuser: RW-CLASS (local: all)

Notes:
  - Template users MUST exist before TACACS+ logins will work
  - With authentication-order 'tacplus', Junos auto-falls-back to
    local password ONLY when the tacplus server is unreachable —
    a tacplus reject does not fall through to local
  - If a login fails silently, the template user is likely missing
  - Each template-user is bound to a LOCAL class of the same name;
    edit its 'permissions' to fit your policy (Junos refuses to set
    permissions on the predefined read-only/operator/super-user names)
  - Uncomment and edit the source-address line to pin the client
    source IP for prefix-ACL matching on tacquito
  - Junos replaces the plaintext 'secret' with '$9$...' on commit,
    but it sits in the candidate config until then — commit promptly
    and protect the commit archive (/config/rescue.conf, juniper.conf.*).
  - Using template: built-in juniper.template

Verify after commit:
  show configuration system tacplus-server
  show configuration system authentication-order
  show configuration snmp
  show configuration system login user RO-CLASS
  show configuration system login user OP-CLASS
  show configuration system login user RW-CLASS
  show cli authorization    (after a TACACS+ login: lists the server's deny values)

Unfilled SNMP values: contact (tacctl scope snmp lab contact '<text>')

