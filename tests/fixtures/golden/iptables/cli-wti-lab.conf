
WTI Console Server Configuration  (scope: lab, firmware v8.x text interface)
(other scopes: prod-inner,prod,dmz — use --scope <name> to emit those)
Follow these steps on the WTI serial (SetUp) console:
--------------------------------------------

Step 1: Log in on the serial SetUp port as an Administrator-level account
        (factory default: super / super) and reach the Text Interface command
        prompt. Keep this serial session open until Step 8 succeeds
        (and, if you add the final DROP, until Step 11 is done).

Step 2: Open the TACACS Parameters menu
        /N [Enter]              Network Parameters (eth0/IPv4 [Shared])
        28 [Enter]              TACACS Parameters -- the item number varies by
                                model/firmware; pick the entry labelled "TACACS"

Step 3: Set each item (type the item number, [Enter], then the value)
         1. Enable                     : On
         2. Primary Host/Address       : 10.0.0.42
         3. Secondary Host/Address     : (leave Undefined -- single tacquito server)
         4. Secret Word                : lab-secret-0123456789abcdef
         5. Fallback Timer             : 15
         6. Fallback Local             : On (Transport Failure)
         7. Authentication Port        : 49
         8. Default User Access        : Enable On, Access Level ViewOnly,
                                         Service Access Telnet/SSH On   (REQUIRED; see notes),
                                         Port Access: the serial ports User- and
                                         ViewOnly-level logins may reach (factory: none;
                                         see "Port access" below); on a power unit also
                                         Plug Access and Plug Group Access
         9. Account Management Module  : Enabled   (TACACS+ authorization -- carries priv-lvl back; REQUIRED)
        10. Session Management Module  : Enabled   (TACACS+ accounting -- needs tacctl's tacquito patch 0002)
        11. Service Name               : wti       (factory default; per-group levels need it, see notes)
        12. Debug                      : Off       (turn On only while troubleshooting)

Step 4: Ping test
        13. Ping TACACS Servers        -- confirms 10.0.0.42 answers ICMP from the unit.
                                          ICMP only: a pass does NOT prove TCP/49 works (Step 5)

Step 5: Check the unit's firewall (IP Tables under /N)
        If the IP Tables list sets 'iptables -P INPUT DROP' or ends in
        'iptables -A INPUT -j DROP', it must also accept loopback and replies
        to the unit's own connections, BEFORE the final DROP:
          iptables -A INPUT -i lo -j ACCEPT
          iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        (older builds: -m state --state ESTABLISHED,RELATED). Without them the
        unit's TACACS+ SYN leaves but tacquito's SYN-ACK is dropped: every
        login waits out the Fallback Timer and tacquito logs nothing.

        Generated for scope 'lab'. Not verified on a unit. It is the unit's whole IP Tables list, in the
        unit's order, from the scope's management permit list (tacctl scope mgmt-acl lab list; the global
        tacctl config mgmt-acl list when the scope has none), the tacctl server's address and the scope's
        SNMP clients (tacctl scope snmp lab clients list). Add one line per entry under /N, IP Tables,
        in this order. The number is the line's place in the list, not part of the command; a line that
        starts with # is a note for you. The final DROP is not in this list: it is the last step, below.

              # the unit's own traffic: loopback, and the replies to its own connections
           1. iptables -A INPUT -i lo -j ACCEPT
           2. iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
              # the tacctl server 10.0.0.42/32: ssh and https
           3. iptables -A INPUT -p tcp -s 10.0.0.42/32 --dport 22 -j ACCEPT
           4. iptables -A INPUT -p tcp -s 10.0.0.42/32 --dport 443 -j ACCEPT
              # permitted range 192.0.2.0/24: ssh and https
           5. iptables -A INPUT -p tcp -s 192.0.2.0/24 --dport 22 -j ACCEPT
           6. iptables -A INPUT -p tcp -s 192.0.2.0/24 --dport 443 -j ACCEPT
              # permitted range 198.51.100.0/25: ssh and https
           7. iptables -A INPUT -p tcp -s 198.51.100.0/25 --dport 22 -j ACCEPT
           8. iptables -A INPUT -p tcp -s 198.51.100.0/25 --dport 443 -j ACCEPT
              # SNMP (udp 161): the tacctl server, then the scope's SNMP clients
           9. iptables -A INPUT -p udp -s 10.0.0.42/32 --dport 161 -j ACCEPT
          10. iptables -A INPUT -p udp -s 198.51.100.0/24 --dport 161 -j ACCEPT
          11. iptables -A INPUT -p udp -s 10.0.0.0/8 --dport 161 -j ACCEPT

        Notes on the list:
          - Line 2: older builds take '-m state --state ESTABLISHED,RELATED' in place of
            '-m conntrack --ctstate ESTABLISHED,RELATED'. It covers the replies of the unit's own TACACS+,
            RADIUS, DNS and NTP queries.
          - Only ssh (22) and https (443) are permitted. Telnet and http are not: to allow them, add the same
            line with '--dport 23' or '--dport 80' for each address above, before the DROP.
          - The udp 161 lines are the SNMP client restriction of Step 6, unless the unit has an SNMP
            access menu of its own (then enter the same clients there).
          - IPv4 only: the unit's 'iptables', not 'ip6tables'. An IPv6 entry of the lists is skipped, with a note.

Step 6: SNMP (so tacctl can read the unit's name and nothing else answers)
        Not verified on a unit: the menu item names below are from WTI's documents.
        Credentials: this scope's own (tacctl scope snmp lab show --reveal).
        /N [Enter]              Network Parameters
        <n> [Enter]             SNMP Parameters -- the item number varies by model/firmware;
                                pick the entry labelled "SNMP"
        Set each item (type the item number, [Enter], then the value):
          Version                   : v2c
          Read-only Community       : lab-ro-community
          Location                  : (NOT SET: tacctl device location <name> '<text>')
          Contact                   : NOC <noc@example.net>

        Client restriction (not verified on a unit): the udp port 161 lines of the IP Tables list (Step 5) are
          the restriction: they accept SNMP only from the clients below and the final DROP (last step) refuses
          the rest. If the unit has an SNMP access menu of its own, enter the same clients there instead.
          allow  10.0.0.42/32
          allow  198.51.100.0/24
          allow  10.0.0.0/8
          refuse 0.0.0.0/0 (everything else)
          Check from the tacctl server: tacctl scope snmp lab test <device-address>

Step 7: Save
        Press [Esc] repeatedly until the unit prints "Saving Configuration"
        and returns to the command prompt.

Step 8: Test from a SECOND session -- keep the Step 1 serial session open as a
        back door until this works. Log in with a tacquito user that is a member
        of scope 'lab', forcing the password method first:
          ssh -o PreferredAuthentications=password <user>@<wti-ip>
        then type /H: the Help menu lists only the commands allowed for the
        access level the server assigned (see the mapping below). Log out with
        /X so the accounting STOP record is sent.
        If a plain 'ssh <user>@<wti-ip>' is closed without a password prompt
        while the password method works, the unit's Invalid Access Lockout is
        armed from earlier failures: /UL clears it.

Step 9: Only if Step 8 fails -- turn on the unit's TACACS debug
        /N, 28, then 12. Debug: On, [Esc] to save. Retry the Step 8 login: the
        unit now echoes each TACACS+ exchange (PAP authentication, then the
        authorization that returns priv-lvl, then accounting) on THIS serial
        session. Read it next to tacquito's debug log (see "Verify" below),
        then set 12. Debug back to Off and [Esc] to save.
        Session dropped ("Broken pipe") right after login, no accounting STOP:
        the tacquito binary lacks patch 0002 -- run 'tacctl upgrade', or set
        10. Session Management Module: Disabled until it is rebuilt.

Step 10: Break-glass local accounts (optional, per scope)
        No break-glass local user is recorded for scope 'lab': with the server
        unreachable and no local account on the device, nobody can log in. Record one with
          tacctl scope breakglass lab add <name> [--role admin|operator|readonly]

Step 11: The final DROP of the IP Tables list (optional; the last step, pasted by you)
        This line turns the list into a restriction, and it is the one that can lock you out. The
        walkthrough does not apply it: you paste it, last, yourself, once the steps above work.
          a) Keep the serial session of Step 1 open (and a second session ready). It is the way back.
          b) Add the DROP as the LAST line of the IP Tables list (after line 11):
               12. iptables -A INPUT -j DROP
          c) Before saving, test a login from a permitted address (repeat Step 8, and from the tacctl
             server: tacctl scope snmp lab test <unit-address>). A login from an address
             outside the list must now be refused.
          d) Save only when the test works. If it fails, delete line 12 on the serial session first.
        Not verified on a unit: whether the unit applies a changed list on entry or on save. If on entry,
        the test above runs with the DROP already in force; the serial session is the way back.

--------------------------------------------
Group → WTI Access Level Mapping (from priv-lvl, or the group's wti-level):
  readonly: priv-lvl 1 → ViewOnly
  operator: priv-lvl 7 → User
  superuser: priv-lvl 15 → Administrator
  (WTI bands: 0-4 ViewOnly, 5-9 User, 10-14 SuperUser, 15 Administrator)
  No group lands in the SuperUser band; to grant it, set a group's WTI level,
  e.g. 'tacctl group edit <group> wti-level superuser'.

Port access (8. Default User Access → Port Access, Step 3):
  These groups reach only the ports turned On there (factory: none), and on a
  power unit only the plugs and plug groups turned On under Plug Access and
  Plug Group Access. One list per unit, shared by every such login:
    readonly: ViewOnly
    operator: User
  Administrator and SuperUser logins reach every port and plug.

Notes:
  - WTI authenticates with PAP (password travels inside the TACACS+ body,
    obfuscated with the shared secret) — tacquito's bcrypt authenticator
    handles PAP, no server-side change needed
  - The Account/Session Management Module items are PAM terms (the unit's
    client is pam_tacplus-style): 'Account' is the TACACS+ authorization
    request that carries priv-lvl back — without it every login gets the
    'Default User Access' level; 'Session' is accounting start/stop
  - Service Name 'wti' (the factory default) has the unit ask for the wti
    service: a group with a WTI level of its own ('tacctl group edit <group>
    wti-level ...') is answered with that level; any other group gets its
    priv-lvl band through the default-service-permit patch (patches/0001),
    which answers an unmatched service with the group's shell priv-lvl
  - A unit set to Service Name 'shell' by the walkthrough of tacctl 0.2.1 or
    earlier still logs every group in at its priv-lvl band, but it ignores the
    WTI levels set on groups until its Service Name is set back to 'wti'
  - Default User Access must be On (Access Level ViewOnly is only the floor;
    the priv-lvl tacquito returns sets the effective level). SSH logins go
    through the unit's OpenSSH, which must resolve the account locally: with
    it Off, a TACACS-only user is invalid to sshd, which sends a junk password
    (OpenSSH's 'INCORRECT' filler) — tacquito then logs 'failed to validate
    the user' on every attempt whatever was typed, and a plain ssh is closed
    unprompted
  - Session Management (accounting) needs tacquito built with tacctl's patch
    0002 (patches/): upstream answers accounting with a non-empty server_msg,
    and the unit drops the SSH session right after login when it gets one.
    'tacctl upgrade' applies the patch overlay and rebuilds
  - A User- or ViewOnly-level login that lands at the right level but sees no
    ports has none turned On under 8. Default User Access → Port Access (see
    "Port access" above). A same-named LOCAL account on the unit overrides
    the server-assigned level — keep the two directories disjoint
  - Fallback Local 'On (Transport Failure)' mirrors this scope's aaa-order;
    keep a local Administrator account on the unit as break-glass. It acts
    only after the TACACS+ transport fails (Fallback Timer expiry), not on an
    immediate 'Connection closed' or 'Permission denied'
  - A firewall that drops tacquito's replies (the unit's own IP Tables
    without ESTABLISHED,RELATED — Step 5) shows up on the server only as
    SYNs in tcpdump and half-open (SYN-RECV) sockets; tacquito logs nothing
  - The unit's source IP must fall inside a prefix of scope 'lab'
    ('tacctl scope lookup <wti-ip>' to check)
  - NETCONF does not exist on the unit (it has a text interface over ssh and a serial port only)
  - Using template: built-in wti.template

Verify on the tacquito side:
  tacctl config loglevel debug          # then log in on the WTI (Step 8) and watch:
  tacctl log tail 50                    # 1. 'accepting user [x] using a bcrypt password'  (PAP authen)
                                        # 2. 'session authz user [x]: client args [service=wti ...]'
                                        # 3. 'authorized user [x] as session based; args [priv-lvl=N]'
  tacctl log accounting                 # start record at login, stop record after /X
  tacctl log failures                   # 'bad secret detected' = Secret Word mismatch;
                                        # 'failed to validate the user [x] using a bcrypt
                                        # password' on EVERY attempt = Default User Access Off;
                                        # 'unknown authenticate start packet type' = unit did not
                                        # send PAP with TACACS+ minor version 1 (open an issue)
  tacctl config loglevel info           # restore when done
  On the WTI (Step 9): with 12. Debug: On the unit echoes each TACACS+ exchange on
  the serial session; line up the authen/author/acct replies with the entries above

