# GENERATED by tacctl from /etc/tacctl/store.yaml and tacctl.yaml. Edits here are overwritten,
# and there is no way to adopt one: change users, groups, scopes and listeners with tacctl.
#
# FreeRADIUS main configuration of tacctl's own instance: the unit starts the daemon with
# '-n tacctl-radius', so the package's radiusd.conf, clients.conf, sites-enabled/ and mods-enabled/
# are not read. PAP only, against the bcrypt hashes of the store.
# render id: fd8e177f94ecf7c2

# The daemon's built-in defaults refer to prefix and localstatedir (without them it passes
# its own check and then fails to start); libdir is where the package keeps the modules.
prefix = /usr
localstatedir = /var
libdir = /usr/lib64/freeradius
logdir = /var/log/radius
pidfile = /run/radiusd/radiusd.pid
max_request_time = 30
cleanup_delay = 5
max_requests = 16384
hostname_lookups = no
proxy_requests = no

log {
	destination = files
	file = ${logdir}/tacctl-radius.log
	auth = no
}

security {
	user = radiusd
	group = radiusd
	allow_core_dumps = no
	max_attributes = 200
	reject_delay = 1
	status_server = no
}

thread pool {
	start_servers = 5
	max_servers = 32
	min_spare_servers = 3
	max_spare_servers = 10
	max_requests_per_server = 0
}

modules {
	files tacctl_users {
		filename = ${confdir}/tacctl-radius.users
	}
	pap tacctl_pap {
		normalise = no
	}
	always tacctl_reject {
		rcode = reject
	}
	always tacctl_drop {
		rcode = handled
	}
	detail tacctl_acct {
		filename = ${logdir}/tacctl-accounting.log
		permissions = 0640
		header = "%t"
	}
	linelog tacctl_auth {
		filename = ${logdir}/tacctl-auth.log
		permissions = 0640
		format = "%S %{reply:Packet-Type} scope=%{client:tacctl_scope} device=%{client:tacctl_device} client=%{%{Packet-Src-IP-Address}:-%{Packet-Src-IPv6-Address}} nas=%{%{NAS-Identifier}:-%{%{NAS-IP-Address}:--}} reason='%{%{Tmp-String-1}:-%{%{Module-Failure-Message}:--}}' user=%{User-Name}"
	}
}

# Connection filters ('tacctl config allow|deny'): no answer for a filtered address.
policy {
	tacctl_filter {
		# filters.deny
		if ((&Packet-Src-IP-Address && (&Packet-Src-IP-Address <= 10.66.0.0/16)) || (&Packet-Src-IPv6-Address && (&Packet-Src-IPv6-Address <= fd00:10::bad/128))) {
			update control {
				&Response-Packet-Type := Do-Not-Respond
			}
			tacctl_drop
		}
		# filters.allow
		if (!((&Packet-Src-IP-Address && (&Packet-Src-IP-Address <= 10.0.0.0/8)) || (&Packet-Src-IP-Address && (&Packet-Src-IP-Address <= 172.16.0.0/12)) || (&Packet-Src-IP-Address && (&Packet-Src-IP-Address <= 192.168.0.0/16)) || (&Packet-Src-IPv6-Address && (&Packet-Src-IPv6-Address <= fd00:10::/64)))) {
			update control {
				&Response-Packet-Type := Do-Not-Respond
			}
			tacctl_drop
		}
	}
}

server tacctl {
	# listeners.radius.auth
	listen {
		type = auth
		ipaddr = *
		port = 1812
	}
	# listeners.radius.acct
	listen {
		type = acct
		ipaddr = *
		port = 1813
	}

	# One client per prefix of every scope RADIUS serves, and one per tagged address of a
	# scope ('tacctl scope devices'). An address in two of them is the client of the longer
	# prefix (the more specific scope, the tagged address), as with TACACS+.
	# tacctl_device is 'generic' or the vendor an address is tagged with; tacctl_send_<vendor>
	# says whether post-auth adds that vendor's attribute for this client.
	client prod-inner.1 {
		ipaddr = 10.10.99.0/24
		secret = "inner\\secret \"quoted\" 0123456789"
		tacctl_scope = "prod-inner"
		tacctl_device = "generic"
		tacctl_send_cisco = "no"
		tacctl_send_juniper = "no"
		tacctl_send_wti = "no"
	}
	client wifi.1 {
		ipaddr = 10.20.0.0/16
		secret = 'wifi-radius-only-0123456789'
		tacctl_scope = "wifi"
		tacctl_device = "generic"
		tacctl_send_cisco = "no"
		tacctl_send_juniper = "no"
		tacctl_send_wti = "no"
	}
	client prod.1 {
		ipaddr = 10.0.0.0/8
		secret = 'prod-secret-0123456789abcdef'
		tacctl_scope = "prod"
		tacctl_device = "generic"
		tacctl_send_cisco = "no"
		tacctl_send_juniper = "no"
		tacctl_send_wti = "no"
	}
	client lab.1 {
		ipaddr = 172.16.0.0/12
		secret = 'it\'s a "lab" secret ${confdir} #1'
		tacctl_scope = "lab"
		tacctl_device = "generic"
		tacctl_send_cisco = "no"
		tacctl_send_juniper = "no"
		tacctl_send_wti = "no"
	}
	client lab.2 {
		ipaddr = 192.168.0.0/16
		secret = 'it\'s a "lab" secret ${confdir} #1'
		tacctl_scope = "lab"
		tacctl_device = "generic"
		tacctl_send_cisco = "no"
		tacctl_send_juniper = "no"
		tacctl_send_wti = "no"
	}
	client lab.3 {
		ipv6addr = fd00:10::/64
		secret = 'it\'s a "lab" secret ${confdir} #1'
		tacctl_scope = "lab"
		tacctl_device = "generic"
		tacctl_send_cisco = "no"
		tacctl_send_juniper = "no"
		tacctl_send_wti = "no"
	}

	authorize {
		tacctl_filter
		update request {
			&Tmp-String-0 := "fd8e177f94ecf7c2/%{client:tacctl_scope}"
		}
		tacctl_users
		if (!ok) {
			update request {
				&Tmp-String-1 := "not an enabled user of this scope"
			}
			tacctl_reject
		}
		tacctl_pap
	}
	authenticate {
		tacctl_pap
	}
	post-auth {
		# A filtered packet (tacctl_filter) gets no answer and no line in the auth log.
		if (!&control:Response-Packet-Type) {
			# Vendor attributes: only for a client whose scope enables the vendor
			# ('tacctl scope vendor-attrs') or whose address is tagged with it
			# ('tacctl scope devices'). The values come from the control list.
			if (("%{client:tacctl_send_cisco}" == "yes") && &control:Tacctl-Priv-Lvl) {
				update reply {
					&Cisco-AVPair := "shell:priv-lvl=%{control:Tacctl-Priv-Lvl}"
				}
			}
			if (("%{client:tacctl_send_juniper}" == "yes") && &control:Tacctl-Juniper-Class) {
				update reply {
					&Juniper-Local-User-Name := &control:Tacctl-Juniper-Class
				}
			}
			if (("%{client:tacctl_send_wti}" == "yes") && &control:Tacctl-WTI-Super) {
				update reply {
					&WTI-Super := &control:Tacctl-WTI-Super
				}
			}
			tacctl_auth
		}
		Post-Auth-Type REJECT {
			update reply {
				&Service-Type !* ANY
				&Cisco-AVPair !* ANY
				&Juniper-Local-User-Name !* ANY
				&WTI-Super !* ANY
			}
			tacctl_auth
		}
	}
	preacct {
		tacctl_filter
	}
	accounting {
		tacctl_acct
	}
}
